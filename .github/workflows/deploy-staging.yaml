name: deploy-staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      release_sha:
        description: Release SHA/image tag to deploy
        required: false
        default: ""
      target_slot:
        description: blue, green, or auto
        required: false
        default: auto
      action:
        description: promote or rollback
        required: false
        default: promote

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yaml
    with:
      environment: staging
      release_sha: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_sha != '' && github.event.inputs.release_sha || github.sha }}
      target_slot: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_slot != '' && github.event.inputs.target_slot || 'auto' }}
      action: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action != '' && github.event.inputs.action || 'promote' }}
      check_public: true
    secrets:
      VM_HOST: ${{ secrets.STAGING_VM_HOST }}
      VM_USER: ${{ secrets.STAGING_VM_USER }}
      VM_SSH_KEY: ${{ secrets.STAGING_VM_SSH_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      PUBLIC_DOMAIN: ${{ secrets.STAGING_PUBLIC_DOMAIN }}
      KERIA_PASSCODE: ${{ secrets.STAGING_KERIA_PASSCODE }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.STAGING_JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}
      GATEWAY_JWT_SECRET: ${{ secrets.STAGING_GATEWAY_JWT_SECRET }}
      BRAN_ENCRYPTION_KEY: ${{ secrets.STAGING_BRAN_ENCRYPTION_KEY }}
      GCP_PROJECT_ID: ${{ secrets.STAGING_GCP_PROJECT_ID }}
